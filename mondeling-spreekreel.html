<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mondeling Spreek-reel · 2.4</title>
<style>
  :root{
    --primary:#2d9cdb; --primary-d:#1b7fbf;
    --success:#27ae60; --warn:#f2994a; --danger:#eb5757;
    --prep:#f2994a;      /* preposition highlight */
    --bg:#0f1b2d; --card:#16263d; --card2:#1d3350;
    --text:#eaf2fb; --muted:#8fa6c2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1d3350 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;min-height:100dvh;overflow:hidden;
  }

  /* ---- top bar ---- */
  header{padding:14px 16px calc(env(safe-area-inset-top) + 4px);display:flex;flex-direction:column;gap:10px;}
  .decks{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  .decks::-webkit-scrollbar{display:none;}
  .deck{
    flex:0 0 auto;border:1px solid #2a466c;background:var(--card);
    color:var(--muted);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .deck.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 14px rgba(45,156,219,.4);}
  .bar{height:4px;background:#22384f;border-radius:99px;overflow:hidden;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#56c1ff);width:0;transition:width .3s;}

  /* ---- card stage ---- */
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px;position:relative;}
  .card{
    width:100%;max-width:560px;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid #2a466c;border-radius:26px;padding:30px 26px 26px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);min-height:62vh;
    display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;
  }
  .tag{position:absolute;top:18px;left:22px;font-size:12px;font-weight:700;letter-spacing:.5px;
    color:var(--primary);text-transform:uppercase;}
  .count{position:absolute;top:18px;right:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}

  .nl{font-size:clamp(30px,7vw,46px);font-weight:800;line-height:1.15;letter-spacing:-.5px;}
  .nl .prep{color:var(--prep);}
  .nl .verb{color:#56c1ff;}
  .en{font-size:clamp(16px,4.4vw,20px);color:var(--muted);font-weight:500;}
  .focus{display:inline-block;align-self:flex-start;background:rgba(242,153,74,.14);color:var(--prep);
    border:1px solid rgba(242,153,74,.4);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;}
  .ex{font-size:clamp(17px,4.6vw,22px);font-weight:600;line-height:1.35;border-left:3px solid var(--primary);padding-left:14px;}
  .ex .prep{color:var(--prep);font-weight:800;}
  .answer{font-size:clamp(20px,5.2vw,28px);font-weight:700;line-height:1.3;}
  .answer .prep{color:var(--prep);}
  .speak-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .mini{background:rgba(86,193,255,.12);border:1px solid rgba(86,193,255,.4);color:#8fd3ff;
    border-radius:10px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;display:flex;gap:7px;align-items:center;}

  .reveal{opacity:0;transform:translateY(14px);}
  .reveal.in{opacity:1;transform:none;transition:opacity .45s ease, transform .45s cubic-bezier(.16,1,.3,1);}

  /* ---- controls ---- */
  footer{padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:12px;}
  .controls{display:flex;align-items:center;justify-content:center;gap:14px;}
  button.nav{width:54px;height:54px;border-radius:50%;border:1px solid #2a466c;background:var(--card);
    color:var(--text);font-size:22px;cursor:pointer;display:grid;place-items:center;transition:.15s;}
  button.nav:active{transform:scale(.92);}
  button.play{width:74px;height:74px;border-radius:50%;border:none;background:var(--primary);color:#fff;
    font-size:30px;cursor:pointer;box-shadow:0 10px 26px rgba(45,156,219,.5);display:grid;place-items:center;}
  button.play:active{transform:scale(.94);}
  .hint{text-align:center;color:var(--muted);font-size:13px;min-height:16px;}
  .toggle{display:flex;gap:8px;justify-content:center;}
  .chip{font-size:12.5px;color:var(--muted);border:1px solid #2a466c;border-radius:99px;padding:6px 12px;cursor:pointer;user-select:none;}
  .chip.on{color:#fff;border-color:var(--primary);background:rgba(45,156,219,.2);}

  .warnbox{display:none;margin:0 16px;background:rgba(235,87,87,.14);border:1px solid rgba(235,87,87,.5);
    color:#ffd1d1;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;}
</style>
</head>
<body>
<header>
  <div class="decks" id="decks"></div>
  <div class="bar"><i id="prog"></i></div>
</header>

<div class="warnbox" id="warn">⚠️ Geen Nederlandse stem gevonden. Installeer een NL-stem of test in Chrome/Edge.</div>

<main>
  <div class="card" id="card"><!-- filled by JS --></div>
</main>

<footer>
  <div class="hint" id="hint">Tik ▶ om de reel te starten — luister en herhaal hardop.</div>
  <div class="controls">
    <button class="nav" id="prev" aria-label="vorige">‹</button>
    <button class="play" id="play" aria-label="afspelen">▶</button>
    <button class="nav" id="next" aria-label="volgende">›</button>
  </div>
  <div class="toggle">
    <span class="chip on" id="tEn">Engels tonen</span>
    <span class="chip on" id="tAuto">Auto-afspelen</span>
    <span class="chip" id="tSlow">Langzaam</span>
  </div>
</footer>

<script>
/* ============================================================
   DATA — uit src/data/mondeling/examen.ts (mondeling 2.4)
   ============================================================ */

// Highlight a preposition word inside a sentence
function hl(sentence, preps){
  let s = sentence;
  preps.forEach(p=>{
    const re = new RegExp('(^|\\s)('+p+')(\\s|\\.|,|$)','g');
    s = s.replace(re,(m,a,b,c)=>a+'<span class="prep">'+b+'</span>'+c);
  });
  return s;
}

const DECKS = [
  {
    name:'🔗 Werkwoord + voorzetsel',
    note:'Onthoud het juiste voorzetsel bij elk werkwoord.',
    cards:[
      ['luisteren','naar','to listen to','Ik luister naar muziek.'],
      ['lijken','op','to resemble','Ik lijk op mijn moeder.'],
      ['geven','aan','to give to','Ik geef een cadeau aan haar.'],
      ['uitkijken','naar','to look forward to','Ik kijk uit naar het weekend.'],
      ['genieten','van','to enjoy','Ik geniet van de zon.'],
      ['denken','aan','to think of','Ik denk aan mijn familie.'],
      ['zich zorgen maken','over','to worry about','Ik maak me zorgen over het klimaat.'],
      ['kwaad zijn','op','to be angry at','Ik ben kwaad op hem.'],
      ['bang zijn','van','to be afraid of','Ik ben bang van onweer.'],
      ['geld uitgeven','aan','to spend money on','Ik geef geld uit aan reizen.'],
      ['akkoord gaan','met','to agree with','Ik ga akkoord met jou.'],
      ['omgaan','met','to deal with','Ik ga om met vriendelijke mensen.'],
      ['hopen','op','to hope for','Ik hoop op mooi weer.'],
      ['dankbaar zijn','voor','to be grateful for','Ik ben dankbaar voor mijn gezondheid.'],
      ['telefoneren','met','to phone (with)','Ik telefoneer met mijn zus.'],
      ['geïnteresseerd zijn','in','to be interested in','Ik ben geïnteresseerd in geschiedenis.'],
      ['geloven','in','to believe in','Ik geloof in mezelf.'],
      ['wachten','op','to wait for','Ik wacht op de bus.'],
      ['klagen','over','to complain about','Ik klaag over het weer.'],
      ['zich ergeren','aan','to be annoyed by','Ik erger me aan lawaai.'],
      ['verliefd zijn','op','to be in love with','Ik ben verliefd op haar.'],
      ['deelnemen','aan','to take part in','Ik neem deel aan het project.'],
    ].map(([verb,prep,meaning,ex])=>({type:'vp',verb,prep,meaning,ex}))
  },
  {
    name:'🤝 Kennismaking (vraag → antwoord)',
    note:'Verbum + voorzetsel in een echt antwoord.',
    cards:[
      ['Naar welke muziek luister jij graag?','What music do you like to listen to?','Ik luister graag naar Belgische pop en soms naar klassieke muziek als ik me wil ontspannen.','luisteren naar',['naar']],
      ['Op wie lijk jij het meest?','Who do you resemble most?','Ik lijk het meest op mijn moeder. Wij hebben dezelfde lach en hetzelfde geduld.','lijken op',['op']],
      ['Waarover maak jij je zorgen?','What do you worry about?','Ik maak mij zorgen over het klimaat, omdat de zomers steeds droger worden.','zich zorgen maken over',['over']],
      ['Aan wie heb jij laatst een cadeau gegeven?','Who did you last give a gift to?','Ik heb laatst een cadeau gegeven aan mijn beste vriendin voor haar verjaardag.','geven aan',['aan']],
      ['Van wie heb jij laatst een compliment gekregen?','Who recently complimented you?','Ik heb laatst een compliment gekregen van mijn collega. Zij zei dat mijn presentatie heel duidelijk was.','krijgen van',['van']],
      ['Heb je genoten van je laatste uitstap?','Did you enjoy your last trip?','Ik ben vorige maand naar Brugge geweest. Ja, ik heb ervan genoten, want het weer was prachtig.','genieten van → ervan',['ervan','van']],
      ['Op wie ben jij soms kwaad?','Who are you sometimes angry at?','Ik ben soms kwaad op mensen die hun afval gewoon op straat gooien.','kwaad zijn op',['op']],
      ['Waar ben jij bang van?','What are you afraid of?','Ik ben bang van onweer. Ik ben bang dat de bliksem in een boom slaat.','bang zijn van',['van']],
      ['Waar geef je graag geld aan uit?','What do you like to spend money on?','Ik geef graag geld uit aan reizen, omdat ik graag nieuwe culturen ontdek.','geld uitgeven aan',['aan']],
      ['Waar denk je vaak aan?','What do you often think about?','Ik denk vaak aan mijn toekomst en aan wat ik later wil doen.','denken aan',['aan']],
      ['Waar ben jij dankbaar voor?','What are you grateful for?','Ik ben dankbaar voor mijn gezondheid en dankbaar dat ik goede vrienden heb.','dankbaar zijn voor',['voor']],
      ['Waarin ben jij het meest geïnteresseerd?','What are you most interested in?','Ik ben het meest geïnteresseerd in geschiedenis en in oude gebouwen.','geïnteresseerd in → waarin',['in']],
      ['Waar moet je vaak op wachten?','What do you often wait for?','Ik moet vaak wachten op de bus, want die is bijna nooit op tijd.','wachten op',['op']],
      ['Waar klaag jij soms over?','What do you sometimes complain about?','Ik klaag soms over het slechte weer en dat het te vaak regent in België.','klagen over',['over']],
    ].map(([prompt,hint,model,focus,preps])=>({type:'qa',prompt,hint,model,focus,preps}))
  },
  {
    name:'🔁 Reflexieve werkwoorden',
    note:'zich … + (er …) — "Aan het einde" vragen.',
    cards:[
      ['Op welk examen bereid jij je nu voor?','Which exam are you preparing for now?','Ik bereid me nu voor op het spreekexamen. Ik bereid me er goed op voor.','zich voorbereiden op → er … op',['op','er']],
      ['Maak jij je zorgen over het milieu?','Do you worry about the environment?','Ja, ik maak me er zorgen over. Ik maak me zorgen over de vele bosbranden.','zich zorgen maken over → er … over',['over','er']],
      ['Verveel jij je snel?','Do you get bored easily?','Nee, ik verveel me bijna nooit. Ik heb altijd wel iets te doen.','zich vervelen',['me']],
      ['Waaraan erger jij je het meest?','What annoys you most?','Ik erger me aan mensen die te laat komen. Ik erger me er echt aan.','zich ergeren aan → er … aan',['aan','er']],
      ['Wat herinner jij je van je kindertijd?','What do you remember from your childhood?','Ik herinner me de lange zomers bij mijn grootouders op het platteland.','zich herinneren',['me']],
      ['Hoe voel jij je vandaag?','How do you feel today?','Ik voel me een beetje gestresseerd, maar ook gemotiveerd voor het examen.','zich voelen',['me']],
    ].map(([prompt,hint,model,focus,preps])=>({type:'qa',prompt,hint,model,focus,preps}))
  },
  {
    name:'🖼️ Beschrijven & 💡 advies',
    note:'Rijke taal + advies geven (als ik jou was / je zou moeten).',
    cards:[
      ['Beschrijf een stad of streek met positieve woorden.','Describe a city with positive words.','Gent is een prachtige, levendige stad. De middeleeuwse gebouwen zijn indrukwekkend en de sfeer is gezellig. Je kan er pittoreske straatjes ontdekken.','BESCHRIJVEN · toerisme',[]],
      ['Welk soort toerist ben jij?','What kind of tourist are you?','Ik ben een avontuurlijke toerist. Ik hou ervan om te wandelen en de lokale cultuur te ontdekken in plaats van de hele dag op het strand te liggen.','BESCHRIJVEN · ik hou ervan om te',['ervan']],
      ['Beschrijf een uitstap die je gemaakt hebt.','Describe a trip you made (perfectum!).','Vorige zomer ben ik naar Dinant geweest. We hebben een boottocht gemaakt en de citadel bezocht. Het was echt de moeite waard.','BESCHRIJVEN · perfectum',[]],
      ['Beschrijf een milieu- of klimaatprobleem.','Describe an environmental problem.','De klimaatverandering zorgt voor meer overstromingen en langere droogtes. Ook ontbossing en milieuvervuiling bedreigen de biodiversiteit.','BESCHRIJVEN · milieu',[]],
      ['Spreek over jouw jeugd: wat mocht je niet doen?','Talk about your youth.','Toen ik klein was, mocht ik niet laat buiten blijven. Mijn ouders waren vrij streng. Mijn leraren waren strenger dan nu, maar ook rechtvaardig.','BESCHRIJVEN · mocht / moest',[]],
      ['Bel 112 om een ongeluk te melden.','Call 112 to report an accident.','Goedendag, ik wil een ongeval melden. Er is een aanrijding gebeurd op de Kerkstraat. Een fietser is gevallen en hij is gewond. Stuur alstublieft een ambulance.','BESCHRIJVEN · noodsituatie',[]],
      ['Geef advies over wat te doen als toerist in België.','Give advice for tourists in Belgium.','Als ik jou was, zou ik zeker Brugge en Gent bezoeken. Je zou ook Belgische frieten en chocolade moeten proberen. Neem de trein, dat is het makkelijkst.','ADVIES · als ik jou was',[]],
      ['Geef formeel advies aan een burgemeester over het milieu.','Formal advice to a mayor.','Mevrouw de burgemeester, ik zou u willen aanraden om meer fietspaden aan te leggen. Daarnaast zou de stad het openbaar vervoer goedkoper kunnen maken om autogebruik te ontmoedigen.','ADVIES · formeel',[]],
      ['Geef advies over de opvoeding van kinderen.','Advice about raising children.','Het is belangrijk dat je duidelijke regels stelt, maar ook geduldig blijft. Je zou je kinderen meer verantwoordelijkheid moeten geven naarmate ze ouder worden.','ADVIES · opvoeding',[]],
      ['Geef formeel advies over hoe ongelukken te voorkomen.','Advice to prevent accidents.','Ik zou willen voorstellen om de snelheid in het centrum te beperken tot 30 km per uur. Zo kunnen we ongelukken met fietsers en voetgangers vermijden.','ADVIES · ongelukken voorkomen',[]],
    ].map(([prompt,hint,model,focus,preps])=>({type:'qa',prompt,hint,model,focus,preps}))
  }
];

/* ============================================================
   SPEECH
   ============================================================ */
let nlVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  nlVoice = vs.find(v=>/nl-BE/i.test(v.lang)) || vs.find(v=>/^nl/i.test(v.lang)) || null;
  document.getElementById('warn').style.display = nlVoice? 'none':'block';
}
speechSynthesis.onvoicechanged = pickVoice;
pickVoice();

function speak(text){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){res();return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang = nlVoice? nlVoice.lang : 'nl-NL';
    if(nlVoice) u.voice=nlVoice;
    u.rate = slow? 0.72 : 0.92;
    u.onend=res; u.onerror=res;
    speechSynthesis.speak(u);
  });
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ============================================================
   STATE + RENDER
   ============================================================ */
let deckIx=0, cardIx=0, playing=false, showEn=true, auto=true, slow=false, token=0;

const $=id=>document.getElementById(id);

function buildDecks(){
  const wrap=$('decks'); wrap.innerHTML='';
  DECKS.forEach((d,i)=>{
    const b=document.createElement('div');
    b.className='deck'+(i===deckIx?' active':'');
    b.textContent=d.name;
    b.onclick=()=>{ deckIx=i; cardIx=0; buildDecks(); render(); if(playing) playLoop(); };
    wrap.appendChild(b);
  });
}

function render(){
  const deck=DECKS[deckIx], c=deck.cards[cardIx];
  $('prog').style.width = ((cardIx+1)/deck.cards.length*100)+'%';
  const card=$('card');
  let html = `<span class="tag">${deck.name.replace(/^[^ ]+ /,'')}</span>
              <span class="count">${cardIx+1} / ${deck.cards.length}</span>`;

  if(c.type==='vp'){
    html += `
      <div class="nl"><span class="verb">${c.verb}</span> <span class="prep">${c.prep}</span></div>
      <div class="en">${showEn? c.meaning : '&nbsp;'}</div>
      <div class="ex reveal" id="r1">${hl(c.ex,[c.prep])}</div>
      <div class="speak-row">
        <span class="mini" data-say="${c.verb} ${c.prep}">🔊 woord</span>
        <span class="mini" data-say="${c.ex}">🔊 zin</span>
      </div>`;
  } else {
    html += `
      <div class="focus">${c.focus}</div>
      <div class="nl">${c.prompt}</div>
      <div class="en">${showEn? c.hint : '&nbsp;'}</div>
      <div class="answer reveal" id="r1">${hl(c.model,c.preps||[])}</div>
      <div class="speak-row">
        <span class="mini" data-say="${c.prompt.replace(/"/g,'')}">🔊 vraag</span>
        <span class="mini" data-say="${c.model.replace(/"/g,'')}">🔊 antwoord</span>
      </div>`;
  }
  card.innerHTML=html;
  card.querySelectorAll('.mini').forEach(m=>m.onclick=()=>{stopSpeak();speak(m.dataset.say);});
}

function revealAnswer(){ const r=$('r1'); if(r) r.classList.add('in'); }

async function playCurrent(){
  const my=++token;
  const deck=DECKS[deckIx], c=deck.cards[cardIx];
  if(c.type==='vp'){
    await speak(c.verb+' '+c.prep); if(my!==token) return;
    revealAnswer();
    await new Promise(r=>setTimeout(r,250)); if(my!==token) return;
    await speak(c.ex);
  } else {
    await speak(c.prompt); if(my!==token) return;
    await new Promise(r=>setTimeout(r,500)); if(my!==token) return;
    revealAnswer();
    await speak(c.model);
  }
  return my;
}

async function playLoop(){
  while(playing){
    const my = await playCurrent();
    if(my!==token || !playing) return;        // interrupted
    if(!auto){ setPlaying(false); return; }    // manual mode: stop after one
    await new Promise(r=>setTimeout(r,900));
    if(!playing) return;
    if(cardIx < DECKS[deckIx].cards.length-1){ cardIx++; }
    else { setPlaying(false); $('hint').textContent='✅ Deck klaar! Kies een ander deck of speel opnieuw.'; return; }
    render();
  }
}

function setPlaying(p){
  playing=p;
  $('play').textContent = p? '⏸' : '▶';
  if(p){ $('hint').textContent='🔊 Luister en herhaal hardop…'; }
  if(!p){ stopSpeak(); token++; }
}

function go(delta){
  const deck=DECKS[deckIx];
  cardIx=Math.max(0,Math.min(deck.cards.length-1,cardIx+delta));
  token++; stopSpeak(); render();
  if(playing) playLoop();
}

/* ---- wire up ---- */
$('play').onclick=()=>{ if(playing){setPlaying(false);} else {setPlaying(true);playLoop();} };
$('next').onclick=()=>go(1);
$('prev').onclick=()=>go(-1);
$('tEn').onclick=e=>{showEn=!showEn;e.target.classList.toggle('on',showEn);render();};
$('tAuto').onclick=e=>{auto=!auto;e.target.classList.toggle('on',auto);};
$('tSlow').onclick=e=>{slow=!slow;e.target.classList.toggle('on',slow);};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '){e.preventDefault();$('play').click();}
});

buildDecks(); render();
</script>
</body>
</html>
